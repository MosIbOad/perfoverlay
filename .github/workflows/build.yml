name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  clang-format:
    name: Code Formatting (Clang-Format)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Clang-Format Style Check
        shell: pwsh
        continue-on-error: true # Warning level per project specification
        run: |
          Write-Host "Checking C++ source formatting against .clang-format..."
          $files = Get-ChildItem -Recurse -Include *.cpp,*.hpp -Path src,tests
          $failed = $false
          foreach ($file in $files) {
            clang-format --dry-run --Werror $file.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Formatting mismatch in $($file.FullName)"
              $failed = $true
            }
          }
          if ($failed) {
            Write-Warning "Formatting warnings found. Run 'clang-format -i src/**/*.cpp src/**/*.hpp tests/**/*.cpp' to format."
          } else {
            Write-Host "All source files match .clang-format specifications."
          }

  build:
    name: Windows x64 Release Build & Test
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 6ade29bbd5a4c7e99439ec52adbc63c073953a57
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-binary-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-

      - name: Configure CMake (Release)
        shell: pwsh
        run: |
          cmake --preset windows-release

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build --preset windows-release

      - name: Run Unit Tests (CTest)
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure
