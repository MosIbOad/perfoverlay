name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 6ade29bbd5a4c7e99439ec52adbc63c073953a57
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-binary-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-

      - name: Configure CMake (Release)
        shell: pwsh
        run: |
          cmake --preset windows-release

      - name: Build Standalone Executable (Release)
        shell: pwsh
        run: |
          cmake --build --preset windows-release

      - name: Run Tests (CTest)
        shell: pwsh
        run: |
          ctest --preset windows-release --output-on-failure

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $pkgDir = "perfoverlay-$version-windows-x64"
          New-Item -ItemType Directory -Path $pkgDir
          Copy-Item "build/windows-release/Release/perfoverlay.exe" -Destination "$pkgDir/perfoverlay.exe"
          Copy-Item "README.md" -Destination "$pkgDir/README.md"
          Copy-Item "LICENSE" -Destination "$pkgDir/LICENSE.txt"
          
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "$pkgDir.zip"
          
          $sha256 = (Get-FileHash "$pkgDir.zip" -Algorithm SHA256).Hash
          Set-Content -Path "$pkgDir.zip.sha256" -Value "$sha256  $pkgDir.zip"
          
          Write-Host "Packaged $pkgDir.zip with SHA256: $sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "perfoverlay ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            perfoverlay-*-windows-x64.zip
            perfoverlay-*-windows-x64.zip.sha256
